[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-harness-protocol"
version = "0.2.3"
description = "A provider-independent port for delegating work to agent harnesses"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Joohyung Park" }]
keywords = ["agent", "agent-harness", "llm", "port", "conformance", "asyncio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/on-the-ground/agent-harness-protocol-py"
Source = "https://github.com/on-the-ground/agent-harness-protocol-py"
Issues = "https://github.com/on-the-ground/agent-harness-protocol-py/issues"
Documentation = "https://github.com/on-the-ground/agent-harness-protocol-py/blob/main/docs/protocol.md"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness_protocol"]

[tool.hatch.build.targets.sdist]
# Adapters are separate distributions; keep their sources and notes out of the core sdist.
exclude = [
  "/implementations",
  "/docs/langgraph-*.md",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.pyright]
pythonVersion = "3.11"
include = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportUnusedImport = false
reportUnsupportedDunderAll = false
